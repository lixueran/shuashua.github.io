<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷刷</title>
    <style>
        /* style 部分保持不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --correct: #10b981;
            --incorrect: #ef4444;
            --border: #475569;
            --favorite: #f59e0b;
            /* 新增：收藏按钮颜色 */
            --favorite-hover: #d97706;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* 主界面样式 */
        .main-screen,
        .quiz-screen,
        .favorites-screen {
            /* 新增：收藏页面样式 */
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* 章节选择区域 */
        .chapter-selection {
            margin-bottom: 30px;
        }

        .chapter-selection h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: var(--accent);
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .chapter-item {
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .chapter-item:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .chapter-item.selected {
            background-color: var(--accent);
            border-color: var(--accent);
            font-weight: bold;
        }

        .chapter-item .chapter-number {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .chapter-item .chapter-name {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .selected-chapters {
            background-color: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid var(--accent);
        }

        .selected-chapters h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            /* 修正: 原为 `margin-bottom: 5px;` */
            color: var(--accent);
        }

        .selected-chapters-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .selected-chapter-tag {
            background-color: var(--accent);
            padding: 5px 12px;
            /* 修正: 原为 `padding: 5px 10px;` */
            border-radius: 20px;
            /* 修正: 原为 `padding: 5px 10px; border-radius: 20px;` */
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .selected-chapter-tag .remove-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            padding: 0;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .selected-chapter-tag .remove-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* 按钮样式 */
        .start-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            margin: 30px auto 0;
            transition: all 0.3s;
            font-weight: bold;
            width: 160px;
        }

        /* 新增：按钮容器，用于并排显示开始和收藏按钮 */
        .button-container {
            display: flex;
            justify-content: center;
            /* gap: 20px; */
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .start-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        /* 新增：查看收藏按钮样式 */
        .favorites-btn {
            background-color: var(--favorite);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            margin: 30px auto 0;
            transition: all 0.3s;
            font-weight: bold;
            width: 160px;
        }

        .favorites-btn:hover {
            background-color: var(--favorite-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
        }

        .favorites-btn:active {
            transform: translateY(0);
        }

        /* 新增：收藏按钮样式 */
        .favorite-btn {
            background-color: var(--favorite);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .favorite-btn:hover {
            background-color: var(--favorite-hover);
        }

        .favorite-btn.favorited {
            background-color: var(--bg-card);
            color: var(--favorite);
            border: 1px solid var(--favorite);
        }

        .favorite-btn.favorited:hover {
            background-color: #2c3a51;
        }

        .quiz-header {
            /* 修正: 原为 `/* 刷题界面header */
            */ display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .quiz-progress {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .quiz-progress .progress-bar {
            width: 200px;
            height: 8px;
            background-color: var(--bg-card);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .quiz-progress .progress-fill {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.5s ease;
        }

        .back-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background-color: var(--bg-card);
        }

        /* 题目区域 */
        .question-container {
            margin-bottom: 30px;
        }

        .question-number {
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 15px;
            background-color: var(--bg-card);
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
        }

        .option:hover {
            border-color: var(--accent);
            transform: translateX(5px);
        }

        .option.selected {
            border-color: var(--accent);
            background-color: rgba(59, 130, 246, 0.1);
        }

        .option.correct {
            border-color: var(--correct);
            background-color: rgba(16, 185, 129, 0.1);
        }

        .option.incorrect {
            border-color: var(--incorrect);
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* 答案区域 */
        .answer-container {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .answer-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .answer-header {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .answer-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .answer-explanation {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-secondary);
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }

        .next-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            margin: 20px auto 0;
            transition: all 0.3s;
            font-weight: bold;
        }

        .next-btn:hover {
            background-color: var(--accent-hover);
        }

        /* 动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .main-screen,
            .quiz-screen,
            .favorites-screen {
                /* 新增 */
                padding: 20px; 
            }

            .chapter-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }

            .quiz-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .quiz-progress .progress-bar {
                width: 100%;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .option {
                padding: 14px 16px;
                font-size: 1rem;
            }
        }
        
    </style>
</head>

<body>
    <div class="container">


        <!-- 主界面 -->
        <div class="main-screen" id="mainScreen">
            <header>
                <h1>刷刷系统</h1>
                <p class="subtitle">刷刷系统 - 夜间护眼模式</p>
            </header>
            <div class="chapter-selection">
                <h2>请选择要练习的章节（可多选）</h2>
                <div class="chapter-grid" id="chapterGrid">
                    <!-- 章节将通过JS动态生成 -->
                </div>

                <div class="selected-chapters">
                    <h3>已选章节</h3>
                    <div class="selected-chapters-list" id="selectedChaptersList">
                        <div class="selected-chapter-tag">
                            暂无选择
                        </div>
                    </div>
                </div>
            </div>

            <!-- 新增：按钮容器，用于并排显示开始和收藏按钮 -->
            <div class="button-container">
                <button class="start-btn" id="startBtn">开始刷题</button>
                <button class="favorites-btn" id="favoritesBtn">查看收藏</button>
            </div>
        </div>

        <!-- 刷题界面 -->
        <div class="quiz-screen" id="quizScreen">
            <div class="quiz-header">
                <div>
                    <h2>刷题模式</h2>
                    <div class="quiz-progress">
                        <div>第 <span id="currentQuestion">1</span> 题 / 共 <span id="totalQuestions">10</span> 题</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                </div>
                <button class="back-btn" id="backBtn">返回章节选择</button>
            </div>

            <div class="question-container">
                <div class="question-number">题目 #<span id="questionId">1</span></div>
                <div class="question-text" id="questionText">
                    <!-- 题目内容将动态加载 -->
                </div>

                <div class="options-container" id="optionsContainer">
                    <!-- 选项将动态加载 -->
                </div>
            </div>

            <div class="answer-container" id="answerContainer">
                <div class="answer-header">
                    <span>答案解析</span>
                    <span id="answerResult"></span>
                </div>
                <div class="answer-text" id="answerText">
                    <!-- 答案内容将动态加载 -->
                </div>
                <div class="answer-explanation" id="answerExplanation">
                    <!-- 解析内容将动态加载 -->
                </div>
                <!-- 新增：收藏按钮 -->
                <button class="next-btn" id="nextBtn">下一题</button>
                <button class="favorite-btn" id="favoriteBtn">收藏本题</button>

            </div>
        </div>

        <!-- 新增：收藏题目界面 -->
        <div class="favorites-screen" id="favoritesScreen" style="display: none;">
            <div class="quiz-header">
                <div>
                    <h2>我的收藏</h2>
                    <div class="quiz-progress">
                        <div>第 <span id="currentFavQuestion">1</span> 题 / 共 <span id="totalFavQuestions">0</span> 题
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="favProgressFill"></div>
                        </div>
                    </div>
                </div>
                <button class="back-btn" id="backFromFavoritesBtn">返回</button>
            </div>

            <div class="question-container">
                <div class="question-number">题目 #<span id="favQuestionId">1</span></div>
                <div class="question-text" id="favQuestionText">
                    <!-- 题目内容将动态加载 -->
                </div>

                <div class="options-container" id="favOptionsContainer">
                    <!-- 选项将动态加载 -->
                </div>
            </div>

            <div class="answer-container" id="favAnswerContainer">
                <div class="answer-header">
                    <span>答案解析</span>
                    <span id="favAnswerResult"></span>
                </div>
                <div class="answer-text" id="favAnswerText">
                    <!-- 答案内容将动态加载 -->
                </div>
                <div class="answer-explanation" id="favAnswerExplanation">
                    <!-- 解析内容将动态加载 -->
                </div>
                <!-- 新增：收藏按钮 -->
                <button class="favorite-btn favorited" id="favFavoriteBtn">取消收藏</button>
                <button class="next-btn" id="nextFavBtn">下一题</button>
            </div>
        </div>
    </div>
    <script type="module">
        import { data } from './questions.js';

        let lists = data();

        let questionBank = { chapters: [] };

        for (let i = 1; i <= 24; i++) {
            questionBank.chapters.push({
                id: i,
                name: `第${i}章 专题内容`,
                questions: []
            });
        }

        lists.forEach((data, i) => {
            const match = data.id.match(/^N(.+?)-/);
            let zj = match ? match[1] : null;
            if (zj === null) return;
            let a = {
                id: i,
                text: data.stem,
                options: data.options,
                answer: data.answer,
                explanation: data.explanation
            };

            const chapterIndex = Number(zj) - 1;
            if (questionBank.chapters[chapterIndex]) {
                questionBank.chapters[chapterIndex].questions.push(a);
            }
        });

        // DOM元素
        const mainScreen = document.getElementById('mainScreen');
        const quizScreen = document.getElementById('quizScreen');
         quizScreen.style.display = 'none';
        const favoritesScreen = document.getElementById('favoritesScreen'); // 新增
        const chapterGrid = document.getElementById('chapterGrid');
        const selectedChaptersList = document.getElementById('selectedChaptersList');
        const startBtn = document.getElementById('startBtn');
        const favoritesBtn = document.getElementById('favoritesBtn'); // 新增
        const backBtn = document.getElementById('backBtn');
        const backFromFavoritesBtn = document.getElementById('backFromFavoritesBtn'); // 新增
        const nextBtn = document.getElementById('nextBtn');
        const nextFavBtn = document.getElementById('nextFavBtn'); // 新增
        const currentQuestionSpan = document.getElementById('currentQuestion');
        const totalQuestionsSpan = document.getElementById('totalQuestions');
        const progressFill = document.getElementById('progressFill');
        const questionIdSpan = document.getElementById('questionId');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const answerContainer = document.getElementById('answerContainer');
        const answerResult = document.getElementById('answerResult');
        const answerText = document.getElementById('answerText');
        const answerExplanation = document.getElementById('answerExplanation');
        const favoriteBtn = document.getElementById('favoriteBtn'); // 新增
        const favQuestionIdSpan = document.getElementById('favQuestionId'); // 新增
        const favQuestionText = document.getElementById('favQuestionText'); // 新增
        const favOptionsContainer = document.getElementById('favOptionsContainer'); // 新增
        const favAnswerContainer = document.getElementById('favAnswerContainer'); // 新增
        const favAnswerResult = document.getElementById('favAnswerResult'); // 新增
        const favAnswerText = document.getElementById('favAnswerText'); // 新增
        const favAnswerExplanation = document.getElementById('favAnswerExplanation'); // 新增
        const favFavoriteBtn = document.getElementById('favFavoriteBtn'); // 新增
        const currentFavQuestionSpan = document.getElementById('currentFavQuestion'); // 新增
        const totalFavQuestionsSpan = document.getElementById('totalFavQuestions'); // 新增
        const favProgressFill = document.getElementById('favProgressFill'); // 新增

        // 全局变量
        let selectedChapters = [];
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let totalQuestions = 10;
        let isInFavoritesMode = false; // 新增：标记是否在收藏模式

        // ================== 新增：收藏功能相关代码 ==================

        // 1. 定义收藏夹在localStorage中的键
        const FAVORITES_KEY = 'shuashua_favorite_questions';

        // 2. 获取所有收藏的题目ID
        function getFavoriteQuestionIds() {
            const saved = localStorage.getItem(FAVORITES_KEY);
            return saved ? JSON.parse(saved) : [];
        }

        // 3. 检查题目是否已收藏
        function isQuestionFavorite(questionId) {
            const favIds = getFavoriteQuestionIds();
            return favIds.includes(questionId);
        }

        // 4. 切换题目收藏状态
        function toggleFavorite(questionId) {
            const favIds = getFavoriteQuestionIds();
            const index = favIds.indexOf(questionId);
            if (index > -1) {
                favIds.splice(index, 1);
            } else {
                favIds.push(questionId);
            }
            localStorage.setItem(FAVORITES_KEY, JSON.stringify(favIds));
            updateFavoriteButtonUI();
        }

        // 5. 更新收藏按钮的UI状态
        function updateFavoriteButtonUI() {
            const currentQuestion = isInFavoritesMode ? currentQuestions[currentQuestionIndex] : currentQuestions[currentQuestionIndex];
            if (!currentQuestion) return;

            const btn = isInFavoritesMode ? favFavoriteBtn : favoriteBtn;
            if (isQuestionFavorite(currentQuestion.id)) {
                btn.classList.add('favorited');
                btn.textContent = '取消收藏';
            } else {
                btn.classList.remove('favorited');
                btn.textContent = '收藏本题';
            }
        }

        // 6. 进入收藏页面
        function enterFavoritesMode() {
            const favIds = getFavoriteQuestionIds();
            if (favIds.length === 0) {
                alert('您的收藏夹是空的！');
                return;
            }

            // 从题库中找到所有收藏的题目
            const allQuestions = questionBank.chapters.flatMap(chapter => chapter.questions);
            currentQuestions = allQuestions.filter(q => favIds.includes(q.id));

            currentQuestionIndex = 0;
            userAnswers = [];
            isInFavoritesMode = true;

            totalQuestions = currentQuestions.length;

            mainScreen.style.display = 'none';
            quizScreen.style.display = 'none';
            favoritesScreen.style.display = 'block';

            loadQuestion(); // 复用loadQuestion函数
        }

        // 7. 退出收藏页面
        function exitFavoritesMode() {
            isInFavoritesMode = false;
            favoritesScreen.style.display = 'none';
            mainScreen.style.display = 'block';
        }

        // ========================================================

        // ================== 进度保存相关代码 (已存在) ==================
        const STORAGE_KEY = 'shuashua_quiz_progress';
        function saveProgress() {
            if (isInFavoritesMode) return; // 收藏模式不保存刷题进度
            const progressData = {
                selectedChapters: selectedChapters,
                currentQuestions: currentQuestions,
                currentQuestionIndex: currentQuestionIndex,
                userAnswers: userAnswers,
                totalQuestions: totalQuestions
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progressData));
        }
        function loadProgress() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            return savedData ? JSON.parse(savedData) : null;
        }
        function clearProgress() {
            localStorage.removeItem(STORAGE_KEY);
        }
        function resumeQuiz(savedData) {
            isInFavoritesMode = false;
            selectedChapters = savedData.selectedChapters;
            currentQuestions = savedData.currentQuestions;
            currentQuestionIndex = savedData.currentQuestionIndex;
            userAnswers = savedData.userAnswers;
            totalQuestions = savedData.totalQuestions;

            mainScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            currentQuestionSpan.textContent = currentQuestionIndex + 1;
            totalQuestionsSpan.textContent = totalQuestions;
            const progress = ((currentQuestionIndex) / totalQuestions) * 100;
            progressFill.style.width = `${progress}%`;

            loadQuestion();
            const currentUserAnswer = userAnswers.find(ans => ans.questionId === currentQuestions[currentQuestionIndex].id);
            if (currentUserAnswer) {
                selectOption(currentUserAnswer.selectedOption, true);
            }
        }
        // ========================================================

        // 初始化章节选择
        function initChapterSelection() {
            chapterGrid.innerHTML = '';
            questionBank.chapters.forEach(chapter => {
                const chapterItem = document.createElement('div');
                chapterItem.className = 'chapter-item';
                chapterItem.dataset.chapterId = chapter.id;
                chapterItem.innerHTML = `
                    <div class="chapter-number">第${chapter.id}章</div>
                    <div class="chapter-name">${chapter.name}</div>
                `;
                chapterItem.addEventListener('click', () => toggleChapterSelection(chapter.id, chapter.name));
                chapterGrid.appendChild(chapterItem);
            });
            updateSelectedChaptersList();
        }

        // 切换章节选择
        function toggleChapterSelection(chapterId, chapterName) {
            const index = selectedChapters.findIndex(ch => ch.id === chapterId);
            const chapterElement = document.querySelector(`.chapter-item[data-chapter-id="${chapterId}"]`);
            if (index === -1) {
                selectedChapters.push({ id: chapterId, name: chapterName });
                chapterElement.classList.add('selected');
            } else {
                selectedChapters.splice(index, 1);
                chapterElement.classList.remove('selected');
            }
            updateSelectedChaptersList();
        }

        // 更新已选章节列表
        function updateSelectedChaptersList() {
            selectedChaptersList.innerHTML = '';
            if (selectedChapters.length === 0) {
                selectedChaptersList.innerHTML = '<div class="selected-chapter-tag">暂无选择</div>';
                startBtn.disabled = true;
                startBtn.style.opacity = '0.6';
                startBtn.style.cursor = 'not-allowed';
                return;
            }
            startBtn.disabled = false;
            startBtn.style.opacity = '1';
            startBtn.style.cursor = 'pointer';
            selectedChapters.forEach(chapter => {
                const tag = document.createElement('div');
                tag.className = 'selected-chapter-tag';
                tag.innerHTML = `
                    第${chapter.id}章
                    <button class="remove-btn" data-chapter-id="${chapter.id}">×</button>
                `;
                const removeBtn = tag.querySelector('.remove-btn');
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleChapterSelection(chapter.id, chapter.name);
                });
                selectedChaptersList.appendChild(tag);
            });
        }

        // 开始刷题
        function startQuiz() {
            if (selectedChapters.length === 0) {
                alert('请至少选择一个章节！');
                return;
            }
            clearProgress();
            currentQuestions = [];
            const selectedQuestions = [];
            selectedChapters.forEach(chapter => {
                const chapterData = questionBank.chapters.find(ch => ch.id === chapter.id);
                if (chapterData) {
                    selectedQuestions.push(...chapterData.questions);
                }
            });
            if (selectedQuestions.length === 0) {
                alert('所选章节暂无题目！');
                return;
            }
            totalQuestions = Math.min(10000000, selectedQuestions.length);
            const shuffled = [...selectedQuestions].sort(() => Math.random() - 0.5);
            currentQuestions = shuffled.slice(0, totalQuestions);
            currentQuestionIndex = 0;
            userAnswers = [];
            isInFavoritesMode = false; // 重置模式

            currentQuestionSpan.textContent = '1';
            totalQuestionsSpan.textContent = totalQuestions;
            progressFill.style.width = '0%';

            mainScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            favoritesScreen.style.display = 'none';

            loadQuestion();
        }

        // 加载题目 (已修改，支持收藏模式)
        function loadQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                showQuizResults();
                return;
            }

            const question = currentQuestions[currentQuestionIndex];
            let ui;

            // 根据模式选择要更新的UI元素
            if (isInFavoritesMode) {
                ui = {
                    currentQuestionSpan: currentFavQuestionSpan,
                    totalQuestionsSpan: totalFavQuestionsSpan,
                    progressFill: favProgressFill,
                    questionIdSpan: favQuestionIdSpan,
                    questionText: favQuestionText,
                    optionsContainer: favOptionsContainer,
                    answerContainer: favAnswerContainer,
                    answerResult: favAnswerResult,
                    answerText: favAnswerText,
                    answerExplanation: favAnswerExplanation,
                };
            } else {
                ui = {
                    currentQuestionSpan: currentQuestionSpan,
                    totalQuestionsSpan: totalQuestionsSpan,
                    progressFill: progressFill,
                    questionIdSpan: questionIdSpan,
                    questionText: questionText,
                    optionsContainer: optionsContainer,
                    answerContainer: answerContainer,
                    answerResult: answerResult,
                    answerText: answerText,
                    answerExplanation: answerExplanation,
                };
            }

            ui.currentQuestionSpan.textContent = currentQuestionIndex + 1;
            ui.totalQuestionsSpan.textContent = totalQuestions;
            const progress = ((currentQuestionIndex) / totalQuestions) * 100;
            ui.progressFill.style.width = `${progress}%`;

            ui.questionIdSpan.textContent = question.id;
            ui.questionText.textContent = question.text;

            ui.optionsContainer.innerHTML = '';
            for (const [key, value] of Object.entries(question.options)) {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.dataset.optionKey = key;
                optionElement.innerHTML = `<span class="option-letter">${key}.</span> ${value}`;
                optionElement.addEventListener('click', () => selectOption(key));
                ui.optionsContainer.appendChild(optionElement);
            }

            ui.answerContainer.classList.remove('show');
            updateFavoriteButtonUI(); // 更新收藏按钮状态
        }

        // 选择选项 (已修改，支持收藏模式)
       // 选择选项 (已修改，支持收藏模式 + 错误自动收藏)
function selectOption(selectedKey, isResuming = false) {
    const ui = isInFavoritesMode ?
        { answerContainer: favAnswerContainer, optionsContainer: favOptionsContainer } :
        { answerContainer: answerContainer, optionsContainer: optionsContainer };

    if (ui.answerContainer.classList.contains('show') && !isResuming) return;

    ui.optionsContainer.querySelectorAll('.option.selected').forEach(opt => opt.classList.remove('selected'));
    const selectedOption = ui.optionsContainer.querySelector(`.option[data-option-key="${selectedKey}"]`);
    selectedOption.classList.add('selected');

    const question = currentQuestions[currentQuestionIndex];
    const isCorrect = selectedKey === question.answer;

    if (!isResuming) {
        userAnswers.push({
            questionId: question.id,
            selectedOption: selectedKey,
            isCorrect: isCorrect
        });
        if (!isInFavoritesMode) { // 只有在正常刷题模式下才保存进度
            saveProgress();
        }

        // 新增：回答错误时自动收藏本题 (非恢复进度、非收藏模式下)
        if (!isCorrect && !isInFavoritesMode) {
            // 先检查是否已收藏，未收藏才执行收藏
            if (!isQuestionFavorite(question.id)) {
                toggleFavorite(question.id);
            }
        }
    }

    showAnswer(isCorrect, question);
}

        // 显示答案 (已修改，支持收藏模式)
        function showAnswer(isCorrect, question) {
            let ui;
            if (isInFavoritesMode) {
                ui = {
                    answerContainer: favAnswerContainer,
                    answerResult: favAnswerResult,
                    answerText: favAnswerText,
                    answerExplanation: favAnswerExplanation,
                    optionsContainer: favOptionsContainer,
                };
            } else {
                ui = {
                    answerContainer: answerContainer,
                    answerResult: answerResult,
                    answerText: answerText,
                    answerExplanation: answerExplanation,
                    optionsContainer: optionsContainer,
                };
            }

            ui.answerContainer.classList.add('show');

            if (isCorrect) {
                ui.answerResult.textContent = "回答正确！";
                ui.answerResult.style.color = "var(--correct)";
            } else {
                ui.answerResult.textContent = "回答错误！";
                ui.answerResult.style.color = "var(--incorrect)";
                
            }

            const correctText = question.options[question.answer];
            ui.answerText.innerHTML = `<strong>正确答案：</strong>${question.answer}. ${correctText}`;
            ui.answerExplanation.textContent = question.explanation;

            ui.optionsContainer.querySelectorAll('.option').forEach(opt => {
                const optKey = opt.dataset.optionKey;
                if (optKey === question.answer) {
                    opt.classList.add('correct');
                } else if (opt.classList.contains('selected') && optKey !== question.answer) {
                    opt.classList.add('incorrect');
                }
            });
        }

        // 下一题 (已修改，支持收藏模式)
        function nextQuestion() {
            currentQuestionIndex++;
            if (!isInFavoritesMode) { // 只有在正常刷题模式下才保存进度
                saveProgress();
            }
            loadQuestion();
        }

        // 显示测验结果
        function showQuizResults() {
            if (isInFavoritesMode) {
                // 在收藏模式下完成，直接返回
                backFromFavoritesBtn.click();
                return;
            }

            clearProgress();
            const correctCount = userAnswers.filter(answer => answer.isCorrect).length;
            const score = userAnswers.length > 0 ? Math.round((correctCount / userAnswers.length) * 100) : 0;

            questionText.innerHTML = `
                <h3 style="text-align: center; margin-bottom: 20px; color: var(--accent);">测验完成！</h3>
                <div style="text-align: center; font-size: 1.2rem; margin-bottom: 30px;">
                    <p>您答对了 <span style="color: var(--correct); font-size: 1.5rem; font-weight: bold;">${correctCount}</span> 题，共 <span style="font-weight: bold;">${userAnswers.length}</span> 题</p>
                    <p>正确率: <span style="color: var(--accent); font-size: 1.5rem; font-weight: bold;">${score}%</span></p>
                </div>
                <div style="text-align: center;">
                    <button class="next-btn" id="restartBtn" style="margin: 10px;">重新开始</button>
                    <button class="back-btn" id="backToChaptersBtn" style="margin: 10px;">返回章节选择</button>
                </div>
            `;

            optionsContainer.innerHTML = '';
            answerContainer.classList.remove('show');

            progressFill.style.width = '100%';
            currentQuestionSpan.textContent = totalQuestions;

            document.getElementById('restartBtn').addEventListener('click', () => {
                startQuiz();
            });

            document.getElementById('backToChaptersBtn').addEventListener('click', () => {
                quizScreen.style.display = 'none';
                mainScreen.style.display = 'block';
            });
        }

        // 返回章节选择
        function backToChapterSelection() {
            if (confirm('确定要返回章节选择吗？当前进度将丢失。')) {
                clearProgress();
                quizScreen.style.display = 'none';
                mainScreen.style.display = 'block';
            }
        }

        // 事件监听
        startBtn.addEventListener('click', startQuiz);
        favoritesBtn.addEventListener('click', enterFavoritesMode); // 新增
        backBtn.addEventListener('click', backToChapterSelection);
        backFromFavoritesBtn.addEventListener('click', exitFavoritesMode); // 新增
        nextBtn.addEventListener('click', nextQuestion);
        nextFavBtn.addEventListener('click', nextQuestion); // 新增
        favoriteBtn.addEventListener('click', () => { // 新增
            const currentQuestion = currentQuestions[currentQuestionIndex];
            toggleFavorite(currentQuestion.id);
        });
        favFavoriteBtn.addEventListener('click', () => { // 新增
            const currentQuestion = currentQuestions[currentQuestionIndex];
            toggleFavorite(currentQuestion.id);
            // 如果在收藏页取消收藏，则立即加载下一题
            nextQuestion();
        });

        // 初始化
        initChapterSelection();
        startBtn.disabled = true;
        startBtn.style.opacity = '0.6';
        startBtn.style.cursor = 'not-allowed';

        // 页面加载时检查并恢复进度
        window.addEventListener('load', () => {
            const savedData = loadProgress();
            if (savedData) {
                if (confirm('检测到您上次未完成的刷题进度，是否继续？')) {
                    resumeQuiz(savedData);
                } else {
                    clearProgress();
                }
            }
        });
    </script>
</body>
