<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>试题解析器 - TXT 转 JSON</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .upload-area,
    .export-area {
      text-align: center;
      margin: 15px 0;
    }

    .question-card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      padding: 16px;
      margin-bottom: 20px;
    }

    .id {
      font-weight: bold;
      color: #d32f2f;
    }

    .stem {
      margin: 10px 0;
      font-size: 16px;
    }

    .options {
      margin: 10px 0;
    }

    .option {
      margin: 4px 0;
    }

    .answer {
      color: #2e7d32;
      font-weight: bold;
    }

    .explanation {
      background-color: #f0f8f0;
      padding: 10px;
      border-left: 4px solid #4caf50;
      margin-top: 10px;
      font-size: 14px;
    }

    button {
      padding: 8px 16px;
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background-color: #1565c0;
    }

    button:disabled {
      background-color: #bdbdbd;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <h1>试题 TXT 解析器（支持导出 JSON）</h1>

  <div class="upload-area">
    <input type="file" id="fileInput" accept=".txt" />
    <p>请选择一个 .txt 文件进行解析</p>
  </div>

  <div class="export-area">
    <button id="exportBtn" disabled>导出为 JSON 文件</button>
  </div>

  <div id="output"></div>

  <script>
    let parsedQuestions = [];

    document.getElementById('fileInput').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        const text = event.target.result;
        parsedQuestions = parseQuestions(text);
        renderQuestions(parsedQuestions);
        document.getElementById('exportBtn').disabled = parsedQuestions.length === 0;
      };
      reader.readAsText(file, 'utf-8');
    });

    document.getElementById('exportBtn').addEventListener('click', function () {
      if (parsedQuestions.length === 0) return;

      const jsonStr = JSON.stringify(parsedQuestions, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'questions.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    function parseQuestions(text) {
      const questionBlocks = text.split(/(?=【[Nn][O0]?\d+-\d+\s*】)/).filter(block => block.trim());
      const questions = [];

      for (const block of questionBlocks) {
        const idMatch = block.match(/【([Nn][O0]?\d+-\d+)\s*】/);
        if (!idMatch) continue;
        let id = idMatch[1].toUpperCase().replace(/N0(\d)/g, 'NO$1');

        // 提取从题干开始到【答案】或【蜗牛解析】之前的内容
        const afterId = block.slice(idMatch[0].length).trim();
        const answerIndex = afterId.search(/【答案】:/);
        const expIndex = afterId.search(/【蜗牛解析】:/);
        const contentEnd = Math.min(
          answerIndex === -1 ? Infinity : answerIndex,
          expIndex === -1 ? Infinity : expIndex
        );
        var contentBeforeAnswer = afterId.slice(0, contentEnd).trim();
        // 测试用写死的文本（你可以后续注释掉这行，恢复真实解析）
        // contentBeforeAnswer=" ()  是利用复杂的算法、模型和规则，从大规模数据集中学习，以创造新的原创内容的人工智 能技术，这项技术能够创造文本，图片，声音，视频和代码等多种类型的内容，全面超越了传统软件的数据 处理和分析能力。A 、NLP   (自然语言处理) B 、AIGC   (生成式人工智能)  C 、OCR   (光学字符识别)D 、CV   (计算机视觉)"

        // ===== 第一步：分离题干和选项文本（保留你的原有逻辑）=====
        const optionStartMatch = contentBeforeAnswer.match(/([A-D][、:\s])/);
        let stem = '';
        let optionsText = contentBeforeAnswer;

        if (optionStartMatch) {
          const idx = optionStartMatch.index;
          stem = contentBeforeAnswer.slice(0, idx).replace(/\s+/g, ' ').trim();
          optionsText = contentBeforeAnswer.slice(idx);
        } else {
          stem = contentBeforeAnswer.replace(/\s+/g, ' ').trim();
          optionsText = '';
        }

        // === 更可靠的选项解析：按 A 、 B 、 分割 ===
        const options = { A: '', B: '', C: '', D: '' };
        const letters = ['A', 'B', 'C', 'D'];
        let remaining = ' ' + optionsText; // 加前导空格便于统一处理

        for (let i = 0; i < letters.length; i++) {
          const current = letters[i];
          const next = letters[i + 1] || '$'; // 用不可能出现的符号表示结尾
          // 构造正则：匹配 "A" 后跟 、/:/空格，然后捕获直到下一个 B/C/D 或结尾
          const regex = new RegExp(
            `\\s*${current}\\s*[、:]\\s*(.*?)\\s*(?=\\s*${next}\\s*[、:]|$)`,
            's'
          );
          const match = remaining.match(regex);
          if (match) {
            options[current] = match[1].replace(/\s+/g, ' ').trim();
            // 更新 remaining 为匹配之后的部分（用于调试可选）
          }
        }
        // 保留你原有兜底逻辑（如果上面没匹配到，继续用宽松方式）
        if (!options.A && !options.B && !options.C && !options.D) {
          const letters = ['A', 'B', 'C', 'D'];
          let remaining = optionsText;
          for (let i = 0; i < letters.length; i++) {
            const current = letters[i];
            const next = letters[i + 1];
            const regex = new RegExp(`${current}\\s*([^${next}]*?)\\s*(?=${next}|$)`, 'i');
            const m = remaining.match(regex);
            if (m) {
              options[current] = m[1].trim();
              remaining = remaining.slice(m[0].length);
            }
          }
        }

        // 提取答案
        const answerMatch = block.match(/【答案】:\s*([A-D])/i);
        const answer = answerMatch ? answerMatch[1].toUpperCase() : '';

        // 提取解析
        const expMatch = block.match(/【蜗牛解析】:\s*([\s\S]*?)(?=【[Nn]|$)/);
        let explanation = expMatch ? expMatch[1].replace(/\s+/g, ' ').trim() : '';
        explanation = explanation.replace(/【[Nn][O0]?.*$/, '').trim();

        questions.push({
          id,
          stem,
          options,
          answer,
          explanation
        });
      }

      return questions;
    }
    function renderQuestions(questions) {
      const outputDiv = document.getElementById('output');
      outputDiv.innerHTML = '';

      if (questions.length === 0) {
        outputDiv.innerHTML = '<p style="text-align:center;color:#888;">未解析到任何题目，请检查文件格式。</p>';
        return;
      }

      questions.forEach(q => {
        const card = document.createElement('div');
        card.className = 'question-card';

        let optionsHtml = '';
        for (const key of ['A', 'B', 'C', 'D']) {
          optionsHtml += `<div class="option">${key}、${q.options[key] || ''}</div>`;
        }

        card.innerHTML = `
          <div class="id">【${q.id}】</div>
          <div class="stem">${q.stem}</div>
          <div class="options">${optionsHtml}</div>
          <div class="answer">【答案】: ${q.answer}</div>
          ${q.explanation ? `<div class="explanation">【蜗牛解析】: ${q.explanation}</div>` : ''}
        `;
        outputDiv.appendChild(card);
      });
    }
  </script>
</body>

</html>
